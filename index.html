<script>
// QUITAR PANTALLA DE CARGA
window.addEventListener('load', () => {
    setTimeout(() => {
        document.getElementById('pantallaCarga').classList.add('ocultar');
    }, 1200);
});

// SELLO CADA 5 MINUTOS
const audio = document.getElementById('sello');
function reproducirSello(){audio.play().catch(e=>console.log('Audio esperando interacción'));}
setInterval(reproducirSello, 300000);
document.addEventListener('click', reproducirSello, {once:true});

// PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}

// BOTÓN INSTALAR APP
let instalacionPendiente = null;
window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    instalacionPendiente = e;
    document.getElementById('btnInstalarApp').style.display = 'inline-block';
});
document.getElementById('btnInstalarApp')?.addEventListener('click', async () => {
    if(!instalacionPendiente) return alert('Usa el menú ? ? Instalar aplicación');
    instalacionPendiente.prompt();
    const res = await instalacionPendiente.userChoice;
    if(res.outcome === 'accepted') document.getElementById('btnInstalarApp').style.display = 'none';
});

// CHAT INTELIGENTE
let contadorMensajes = 0;
let historial = "Consulta desde tu página web:\n";
function abrirCerrarChat(){
    document.getElementById('ventanaChat').classList.toggle('activo');
    if(contadorMensajes===0){
        agregarMensaje("¡Hola! Escribe tus datos y lo que necesitas. Al terminar se envía todo directo al WhatsApp.","sistema");
        contadorMensajes++;
    }
}
function agregarMensaje(texto,tipo){
    const caja = document.getElementById('cajaMsj');
    const div = document.createElement('div');
    div.className = `msj msj-${tipo}`;
    div.textContent = texto;
    caja.appendChild(div);
    caja.scrollTop = caja.scrollHeight;
}
function enviarMsj(){
    const texto = document.getElementById('textoMsj').value.trim();
    if(!texto) return;
    agregarMensaje(texto,"yo");
    historial += texto + "\n";
    contadorMensajes++;
    document.getElementById('textoMsj').value = "";
    if(contadorMensajes >= 3){
        setTimeout(()=>{
            agregarMensaje("? Listo, se enviará tu mensaje...","sistema");
            setTimeout(()=>{
                window.open("https://wa.me/51930282895?text=" + encodeURIComponent(historial),"_blank");
                abrirCerrarChat();
                contadorMensajes = 0;
                historial = "Consulta desde tu página web:\n";
            },1200);
        },500);
    }
}
</script>
